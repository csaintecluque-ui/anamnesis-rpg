<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1512" />
    <title>Anamnesis</title>
    <link rel="icon" type="image/svg+xml" href="./assets/brand/logo-small.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anamnesis" />
    <meta name="description" content="RPG isométrique au tour par tour dans l’univers d’Anamnesis." />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1512;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100vw;
        height: 100dvh;
      }
      /* A phone held upright: the game is drawn for a wide screen, its text would be tiny (test du 2026-11-06). */
      #tourner {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #tourner {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: #1b1512;
          color: #ead9b8;
          font: 22px/1.4 Georgia, 'Times New Roman', serif;
          text-align: center;
        }
        #tourner span {
          display: block;
          margin-top: 12px;
          color: #c9804f;
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="tourner">
      <p>Tourne ton téléphone : Anamnesis se joue à l’horizontale.<span>Ta partie t’attend, rien n’est perdu.</span></p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
